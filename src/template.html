<title>Flag Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  /* Tailwind reads its colours and fonts from the CSS tokens below, so one palette drives everything. */
  if (window.tailwind) {
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: 'var(--paper)', 'paper-hi': 'var(--paper-hi)', 'paper-lo': 'var(--paper-lo)',
            ink: 'var(--ink)', 'ink-soft': 'var(--ink-soft)', rule: 'var(--rule)', sea: 'var(--sea)',
            madder: 'var(--madder)', verdigris: 'var(--verdigris)', ochre: 'var(--ochre)'
          },
          fontFamily: {
            display: 'var(--font-display)', script: 'var(--font-script)',
            body: 'var(--font-body)', data: 'var(--font-data)'
          }
        }
      }
    };
  }
</script>
<style>
  /* Layout: white cards on a cool ground. Each screen opens with a navy band; the flag sits on a boarding pass with a tear line above the answers. */
  :root {
    --paper: #EEF2F7;      /* the ground behind the cards */
    --paper-hi: #FFFFFF;   /* cards */
    --paper-lo: #F2F5FA;   /* quiet fills: tiles, hint buttons, hover */
    --ink: #0F1B33;
    --ink-soft: #47577A;
    --rule: #C9D3E2;       /* lines and resting outlines */
    --sea: #E3EBF6;        /* the tint behind each flag, and behind a selected choice */
    --madder: #B3261E;     /* costs and misses */
    --verdigris: #14664A;  /* gains and correct answers */
    --ochre: #8A6512;      /* gold dark enough to read as text */
    --gold: #C9A24A;       /* gold as a fill or a line */
    --navy: #14274A;       /* the band across the top, taken from the passport cover */
    --band-fg: #FFFFFF; --band-gold: #E2BE6A;
    --line: #14274A;       /* outlines of things you can press */
    --go-bg: #14274A; --go-fg: #FFFFFF; --go-edge: #C9A24A;      /* the main button */
    --ok-tint: #E1F2EA; --no-tint: #FBE9E7; --gold-tint: #F6EDD6;
    --on-accent: #FFFFFF;
    --card-shadow: 0 6px 18px rgba(20, 39, 74, .12);
    --flag-edge: rgba(15, 27, 51, .3);
    --flag-shadow: rgba(15, 27, 51, .22);
    --focus: #2F5BD0;
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-script: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    --font-data: 'IBM Plex Mono', ui-monospace, Menlo, 'Courier New', monospace;
    --flag-h: clamp(120px, 22vh, 224px);
    /* The passport is an object in the hand: a navy booklet with gold lettering, the same in both themes */
    --pp-navy: #1B2947; --pp-gold: #CFAE66; --pp-page: #F1EEE2; --pp-ink: #26324F; --pp-edge: #B9B39E;
    --pp-ink-a: #2A4B8D; --pp-ink-b: #9B2D3A; --pp-ink-c: #2B6A4C; --pp-ink-d: #5B3A8C; --pp-ink-gold: #8A6512;
    --pp-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    --pp-hand: 'Snell Roundhand', 'Segoe Script', 'Brush Script MT', cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0A1322; --paper-hi: #131F36; --paper-lo: #1A2946;
      --ink: #EEF2F9; --ink-soft: #A6B3CC; --rule: #2E3F60; --sea: #1D2D4D;
      --madder: #FF9088; --verdigris: #62D9AA; --ochre: #E2BE6A; --gold: #C9A24A; --navy: #1D2F58;
      --line: #62759F; --go-bg: #E2BE6A; --go-fg: #0A1322; --go-edge: #8A6C22;
      --ok-tint: #123828; --no-tint: #3F1C1A; --gold-tint: #3A2F12; --on-accent: #0A1322;
      --card-shadow: 0 6px 18px rgba(0, 0, 0, .35); --flag-edge: rgba(0, 0, 0, .6); --flag-shadow: rgba(0, 0, 0, .45); --focus: #8FB0FF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0A1322; --paper-hi: #131F36; --paper-lo: #1A2946;
    --ink: #EEF2F9; --ink-soft: #A6B3CC; --rule: #2E3F60; --sea: #1D2D4D;
    --madder: #FF9088; --verdigris: #62D9AA; --ochre: #E2BE6A; --gold: #C9A24A; --navy: #1D2F58;
    --line: #62759F; --go-bg: #E2BE6A; --go-fg: #0A1322; --go-edge: #8A6C22;
    --ok-tint: #123828; --no-tint: #3F1C1A; --gold-tint: #3A2F12; --on-accent: #0A1322;
    --card-shadow: 0 6px 18px rgba(0, 0, 0, .35); --flag-edge: rgba(0, 0, 0, .6); --flag-shadow: rgba(0, 0, 0, .45); --focus: #8FB0FF;
    color-scheme: dark;
  }

  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Larger text: everything sized in rem grows by an eighth, and the smallest labels grow a little more */
  :root[data-text="large"] { font-size: 112.5%; }
  :root[data-text="large"] .fx-label, :root[data-text="large"] .fx-quiet, :root[data-text="large"] .fx-pill { font-size: .78rem; letter-spacing: .05em; }
  :root[data-text="large"] .fx-hint.used .fx-label { font-size: .68rem; letter-spacing: .05em; }

  /* Cards. Their padding is held in variables so the navy band and the tear line can run from edge to edge. */
  .fx-sheet { --px: 1.125rem; --py: 1.125rem; background: var(--paper-hi); border-radius: 18px; box-shadow: var(--card-shadow); padding: var(--py) var(--px); }
  @media (min-width: 640px) { .fx-sheet { --px: 1.75rem; --py: 1.6rem; } }
  .fx-band { margin: calc(-1 * var(--py)) calc(-1 * var(--px)) 1rem; padding: .85rem var(--px) 1rem; border-radius: 18px 18px 0 0; background: var(--navy); color: var(--band-fg); }
  .fx-band .fx-label, .fx-band .fx-quiet, .fx-band .fx-compass { color: var(--band-gold); }
  .fx-band .fx-num { color: var(--band-fg); font-size: 1.75rem; line-height: 1; }
  .fx-band .fx-ava { background: var(--band-fg); }
  .fx-label { font-family: var(--font-data); font-weight: 500; font-size: .69rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); line-height: 1.35; }
  .fx-num { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; color: var(--ink); }
  .fx-h { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; text-wrap: balance; }
  .fx-word { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; line-height: 1; white-space: nowrap; font-size: clamp(1.35rem, 6.6vw, 1.85rem); }
  .fx-rule { border: 0; border-top: 1px solid var(--rule); }
  .fx-star { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: .9em; }
  .font-script { font-weight: 600; }
  .fx-compass { color: var(--ink); }
  .fx-compass-in { fill: var(--paper-hi); }
  .fx-band .fx-compass-in { fill: var(--navy); }
  .fx-seal .fx-compass-in { fill: var(--sea); }

  /* Round progress: ten bars */
  .fx-progress { display: flex; align-items: center; gap: .75rem; }
  .fx-scale-bar { flex: 1; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
  .fx-seg { height: 8px; border-radius: 4px; background: var(--rule); }
  .fx-seg.ok { background: var(--ink); }
  .fx-seg.miss { background: var(--madder); }
  .fx-seg.now { background: var(--gold); }

  /* The boarding pass: the flag on a tinted panel, then a tear line with a notch at each edge */
  .fx-plate { display: flex; flex-direction: column; gap: .6rem; margin: 1rem 0 0; }
  .fx-flagbox { position: relative; height: calc(var(--flag-h) + 1.5rem); display: flex; align-items: center; justify-content: center; padding: .75rem; border-radius: 12px; background: var(--sea); }
  .fx-flag {
    width: min(100%, calc(var(--flag-h) * var(--ar))); aspect-ratio: var(--ar); height: auto; max-width: 100%;
    filter: drop-shadow(0 0 .6px var(--flag-edge)) drop-shadow(0 6px 10px var(--flag-shadow));
    animation: fx-rise .3s ease-out both;
  }
  .fx-caption { font-family: var(--font-body); font-weight: 600; font-size: 1.1rem; text-align: center; line-height: 1.25; min-height: 1.35em; text-wrap: balance; }
  .fx-caption.named { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; text-transform: uppercase; letter-spacing: .04em; }
  .fx-thumb { width: 2.25rem; height: 1.5rem; object-fit: contain; flex: none; filter: drop-shadow(0 0 .6px var(--flag-edge)); }
  .fx-perf { position: relative; height: 0; margin: 1rem calc(14px - var(--px)) 0; border-top: 2px dashed var(--rule); }
  .fx-perf::before, .fx-perf::after { content: ''; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); }
  .fx-perf::before { left: -24px; }
  .fx-perf::after { right: -24px; }
  .fx-pill { font-family: var(--font-data); font-weight: 600; font-size: .69rem; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; border-radius: 999px; padding: .3rem .65rem; line-height: 1.3; }
  .fx-pill.ok { color: var(--verdigris); background: var(--ok-tint); }
  .fx-pill.no { color: var(--madder); background: var(--no-tint); }
  .fx-pill.gold { color: var(--ochre); background: var(--gold-tint); }
  .fx-tip { margin-top: .5rem; padding: .4rem .7rem; border-radius: 12px; background: var(--gold-tint); font-size: .85rem; line-height: 1.3; }
  .fx-tip b { color: var(--ochre); font-weight: 700; }

  @media (max-width: 350px) { .fx-sheet { --px: .8rem; } .fx-opt { padding: .45rem; gap: .4rem; } }
  @media (max-height: 740px) {
    :root { --flag-h: clamp(100px, 19vh, 224px); }
    .fx-band { padding-block: .6rem .7rem; margin-bottom: .7rem; }
    .fx-plate { margin-top: .7rem; gap: .45rem; }
    .fx-flagbox { height: calc(var(--flag-h) + 1rem); padding: .5rem; }
    .fx-perf { margin-top: .7rem; }
    .fx-opt { min-height: 3.25rem; }
    .fx-hint-l { margin-top: .45rem; }
    .fx-hint { min-height: 2.85rem; }
  }

  /* Answer buttons */
  .fx-opt {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .5rem; text-align: left;
    min-height: 3.75rem; padding: .5rem .6rem; background: var(--paper-hi); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 14px; box-shadow: 0 2px 0 var(--line);
    font-size: 1rem; font-weight: 600; line-height: 1.15; overflow-wrap: anywhere;
    transition: transform .08s, box-shadow .08s, background-color .15s;
  }
  @media (hover: hover) { .fx-opt:not(:disabled):hover { background: var(--paper-lo); } }
  .fx-opt:not(:disabled):active { transform: translateY(2px); box-shadow: 0 0 0 var(--line); }
  .fx-key { display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--line); color: var(--paper-hi); font-family: var(--font-data); font-weight: 600; font-size: .75rem; }
  .fx-opt:disabled { cursor: default; }
  .fx-opt.dim { color: var(--ink-soft); border-color: var(--rule); background: var(--paper-lo); box-shadow: none; }
  .fx-opt.out { color: var(--ink-soft); border: 1.5px dashed var(--rule); background: transparent; box-shadow: none; text-decoration: line-through; opacity: .65; }
  .fx-opt.dim .fx-key, .fx-opt.out .fx-key { background: var(--rule); color: var(--ink-soft); }
  .fx-opt.right { background: var(--verdigris); border-color: var(--verdigris); color: var(--on-accent); box-shadow: none; }
  .fx-opt.right .fx-key { background: var(--on-accent); color: var(--verdigris); }
  .fx-opt.wrong { border-color: var(--madder); color: var(--madder); background: var(--no-tint); box-shadow: none; }
  .fx-opt.wrong .fx-key { background: var(--madder); color: var(--paper-hi); }
  .fx-mark { font-family: var(--font-data); font-weight: 600; }
  .fx-mark:empty { display: none; }

  /* Hint buttons: gold, raised like the answers, under a line that says what they are */
  .fx-hint-l { display: flex; align-items: center; gap: .35rem; margin-top: .65rem; color: var(--ochre); font-weight: 600; }
  .fx-hint-l svg { flex: none; }
  .fx-hint {
    display: flex; flex-direction: column; justify-content: center; gap: .05rem; text-align: center; min-height: 3.1rem; padding: .3rem;
    border: 1.5px solid var(--gold); border-radius: 12px; background: var(--gold-tint); color: var(--ink); line-height: 1.2; overflow-wrap: anywhere;
    box-shadow: 0 2px 0 var(--gold); transition: transform .08s, box-shadow .08s, background-color .15s;
  }
  @media (hover: hover) { .fx-hint:not(:disabled):hover { background: var(--paper-hi); } }
  .fx-hint:not(:disabled):active { transform: translateY(2px); box-shadow: 0 0 0 var(--gold); }
  .fx-hint:disabled { cursor: default; box-shadow: none; }
  .fx-hint .fx-label { font-family: var(--font-body); font-weight: 700; font-size: .88rem; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .fx-hint.used { background: var(--paper-hi); border-style: dashed; }
  .fx-hint.used .fx-label { font-family: var(--font-data); font-weight: 500; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .fx-hint .fx-cost { font-family: var(--font-data); font-weight: 600; font-size: .76rem; color: var(--madder); }
  .fx-hint .fx-reveal { font-weight: 700; font-size: .9rem; }

  /* Primary action */
  .fx-go {
    display: block; width: 100%; min-height: 3.5rem; padding: .6rem 1rem; background: var(--go-bg); color: var(--go-fg); border: 0; border-radius: 14px;
    font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; letter-spacing: .06em; text-transform: uppercase; text-align: center;
    box-shadow: 0 3px 0 var(--go-edge); transition: transform .08s, box-shadow .08s;
  }
  .fx-go:active { transform: translateY(3px); box-shadow: 0 0 0 var(--go-edge); }
  .fx-quiet { font-family: var(--font-data); font-weight: 500; font-size: .69rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; padding: .5rem 0; }

  /* A perfect round is announced as one large gold stamp; the gold star marks it on the tables */
  .fx-perfect {
    display: inline-block; padding: .5rem 1rem .55rem; color: var(--ochre); background: var(--gold-tint); border: 3px solid currentColor; border-radius: 14px;
    box-shadow: inset 0 0 0 3px var(--paper-hi), inset 0 0 0 4.5px currentColor; transform: rotate(-3deg);
    font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 8.4vw, 2.5rem); line-height: 1; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
    animation: fx-seal .4s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .fx-perfect svg { display: inline-block; vertical-align: .06em; }
  .fx-gold-star { display: inline-block; flex: none; vertical-align: -.15em; }
  /* Passport milestones on the results screen */
  .fx-feat { margin-top: 1.1rem; padding: .85rem 1rem .9rem; border: 2px solid var(--gold); border-radius: 14px; background: var(--gold-tint); animation: fx-seal .4s cubic-bezier(.2, 1.4, .4, 1) both; }
  .fx-feat h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.05; letter-spacing: .03em; text-transform: uppercase; color: var(--ochre); }
  .fx-feat.big { padding: 1.1rem 1.15rem 1.15rem; border-width: 3px; }
  .fx-feat.big h2 { font-size: clamp(1.9rem, 9vw, 2.6rem); margin-top: .2rem; }
  .fx-feat p { margin-top: .4rem; font-size: .95rem; line-height: 1.4; }

  /* Result stamp */
  .fx-stamp {
    display: inline-block; flex: none; font-family: var(--font-data); font-weight: 600; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; text-align: center; line-height: 1.3;
    padding: .45rem .75rem; border: 2.5px solid currentColor; border-radius: 10px; box-shadow: inset 0 0 0 3px var(--paper-hi), inset 0 0 0 4px currentColor;
    transform: rotate(-5deg); animation: fx-stamp .32s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .fx-stamp.ok { color: var(--verdigris); }
  .fx-stamp.no { color: var(--madder); }
  .fx-stamp.bonus { color: var(--ochre); }

  /* Player avatars: an emoji in a gold-ringed disc */
  .fx-ava {
    display: inline-grid; place-items: center; flex: none; width: var(--s, 3.25rem); height: var(--s, 3.25rem); border-radius: 50%;
    background: var(--paper-hi); box-shadow: 0 0 0 2px var(--gold);
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: calc(var(--s, 3.25rem) * .52); line-height: 1;
  }
  button.fx-ava { background: var(--paper-lo); box-shadow: 0 0 0 1.5px var(--rule); transition: transform .1s; }
  @media (hover: hover) { button.fx-ava:hover { background: var(--sea); } }
  button.fx-ava[aria-pressed="true"] { background: var(--sea); box-shadow: 0 0 0 3px var(--line); transform: scale(1.07); }
  .fx-ava.blank { background: transparent; box-shadow: none; border: 1.5px dashed var(--rule); }
  .fx-input {
    display: block; width: 100%; min-width: 0; padding: .6rem .8rem; background: var(--paper-hi); color: var(--ink);
    border: 1.5px solid var(--rule); border-radius: 12px; font-family: var(--font-body); font-size: 1.15rem; font-weight: 600; line-height: 1.3;
  }
  .fx-input:focus { border-color: var(--line); }
  .fx-input::placeholder { color: var(--ink-soft); font-weight: 400; }
  .fx-clip { overflow: hidden; text-overflow: ellipsis; }
  /* Pass and play: the line-up on the game-choice screen, and each player's flags folded away on the result */
  .fx-seat { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .65rem; }
  .fx-seat .fx-input { padding: .45rem .7rem; font-size: 1.05rem; }
  .fx-fold + .fx-fold { border-top: 1px solid var(--rule); }
  .fx-fold summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 1rem; align-items: center; gap: .6rem; padding: .55rem 0; cursor: pointer; list-style: none; }
  .fx-fold summary::-webkit-details-marker { display: none; }
  .fx-fold summary::after { content: '+'; font-family: var(--font-data); font-weight: 600; color: var(--ink-soft); text-align: center; }
  .fx-fold[open] summary::after { content: '−'; }
  .fx-tile { background: var(--paper-lo); border-radius: 12px; padding: .55rem .4rem; }

  /* High scores */
  .fx-hhead, .fx-hrow { display: grid; grid-template-columns: 2.5rem auto minmax(0, 1fr) auto; align-items: center; column-gap: .65rem; padding: .45rem .5rem; }
  .fx-hhead { padding-block: 0 .35rem; border-bottom: 1.5px solid var(--ink); }
  .fx-hrow + .fx-hrow { border-top: 1px solid var(--rule); }
  .fx-hrank { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; text-transform: uppercase; color: var(--ink-soft); }
  .fx-hrow.top .fx-hrank { color: var(--ochre); }
  .fx-hrow.hot { background: var(--gold-tint); border-radius: 10px; }
  .fx-hrow.empty { color: var(--ink-soft); }
  .fx-day { display: grid; width: 100%; grid-template-columns: 5.4rem minmax(0, 1fr) auto; align-items: baseline; column-gap: .65rem; padding: .45rem .5rem; text-align: left; color: inherit; background: none; border-radius: 10px; }
  #fx-days li + li { border-top: 1px solid var(--rule); }
  .fx-day[aria-pressed="true"] { background: var(--gold-tint); }

  /* Game choices on the second screen */
  .fx-mode {
    display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .65rem; row-gap: .1rem; width: 100%; text-align: left; line-height: 1.3;
    padding: .7rem .8rem; background: var(--paper-hi); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 14px;
  }
  .fx-mode::before { content: ''; grid-row: 1 / span 2; width: 1rem; height: 1rem; margin-top: .15rem; border: 1.5px solid var(--line); border-radius: 50%; }
  .fx-mode > * { grid-column: 2; }
  .fx-mode b { font-weight: 700; font-size: 1.02rem; }
  .fx-mode small { font-size: .86rem; color: var(--ink-soft); }
  .fx-mode[aria-pressed="true"] { background: var(--sea); border-color: var(--line); }
  .fx-mode[aria-pressed="true"]::before { background: var(--line); box-shadow: inset 0 0 0 3px var(--sea); }
  .fx-mode[aria-pressed="true"] small { color: var(--ink); opacity: .8; }
  .fx-pick { min-height: 2.75rem; padding: .5rem .25rem; text-align: center; font-size: clamp(.78rem, 3.5vw, .92rem); font-weight: 600; line-height: 1.2; background: var(--paper-hi); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 12px; }
  .fx-pick[aria-pressed="true"] { background: var(--go-bg); color: var(--go-fg); border-color: var(--go-bg); }

  /* The clock on timed rounds, and the sealed final flag */
  .fx-clock { height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
  .fx-clock i { display: block; height: 100%; border-radius: 4px; background: var(--gold); transform-origin: left center; transition: transform .1s linear; }

  }
  // Best score first; players level on points share a place.
  const standings = () => M.seats.map((seat, k) => ({ k, P: seat.P, S: seat.S })).sort((a, b) => b.S.score - a.S.score || a.k - b.k)
    .map((r, _, all) => Object.assign(r, { place: 1 + all.filter(o => o.S.score > r.S.score).length }));

  function startQuestion() {
    const r = S.round[S.i];
    S.q = { a2: r.a2, options: r.options, lead: r.lead, bonus: Object.assign({}, r.bonus, { pick: null }), hints: [], out: [], pick: null, wager: 0, phase: 'wager', t0: 0 };
    // The final flag opens with the wager, as long as there is something to risk.
    if (S.i < S.round.length - 1 || S.score < WAGERS[0]) beginGuess();
  }
  function beginGuess() { S.q.phase = 'guess'; S.q.t0 = Date.now(); }
  function setWager(v) {
    const q = S.q;
    if (q.phase !== 'wager' || v > S.score) return;
    q.wager = v; beginGuess();
  }

  function useHint(id) {
    const q = S.q;
    if (q.phase !== 'guess' || q.wager || q.hints.includes(id)) return;   // no hints on a wagered flag
    q.hints.push(id);

  }

  const bonusTimed = () => !!(S.limit && S.mode === 'daily');
  function beginBonus() { S.q.phase = 'bonus'; S.q.t0 = Date.now(); }
  // The time an answer took, counted towards the round's time. A timed-out answer counts as the full allowance.
  function addTime(secs) { if (S.limit) S.ms = (S.ms || 0) + Math.round(1000 * Math.min(S.limit, Math.max(0, secs))); }

  // a2 is the country picked, or null when the clock ran out.
  function answer(a2) {
    const q = S.q;
    if (q.phase !== 'guess' || (a2 && q.out.includes(a2))) return;
    if (S.tip) { S.tip = false; store.set('fx-tipped', [...new Set([...store.get('fx-tipped', []), plain(P.name)])]); }   // the first-flag tip is shown once per player
    q.pick = a2;

    addTime(secs);

    S.streak = clean ? S.streak + 1 : 0;        // a hint ends the streak just as a miss does
    S.topStreak = Math.max(S.topStreak, S.streak);
    // The strict rule: the bonus only opens for a correct guess made with no hints at all.
    const bonus = !ok ? 'none' : q.hints.length ? 'locked' : 'pending';
    const e = { a2: q.a2, ok, timedOut: a2 === null, hints: [...q.hints], pts, cost: ok ? BASE - pts : 0, bonus, bonusPts: 0, streak: S.streak,
      streakPts: clean ? streakBonus(S.streak) : 0, runLost: clean ? 0 : run,
      speedPts: ok && S.clock ? speedBonus(secs) : 0, wagerPts: q.wager ? (ok ? q.wager : -q.wager) : 0 };
    S.log.push(e);
    S.score += e.pts + e.streakPts + e.speedPts + e.wagerPts;
    if (ok && !S.practice && addStamp(q.a2)) S.newStamps++;
    if (ok && !q.hints.length && !S.practice && addExpert(q.a2)) S.newExpert++;
    q.phase = 'result';
    if (!ok) { if (e.timedOut) SFX.timeout(); else SFX.wrong(); if (q.wager) SFX.wagerLose(); }
    else { SFX.right(); if (q.wager) SFX.wagerWin(); else if (e.streakPts && STREAK.some(t => t[0] === S.streak)) SFX.streak(S.streak); }
  }

  function answerBonus(i) {
    const q = S.q, e = S.log[S.log.length - 1];

    q.bonus.pick = i;
    if (i === q.bonus.answer) { e.bonus = 'won'; e.bonusPts = BONUS; S.score += BONUS; SFX.bonus(); } else { e.bonus = 'lost'; SFX.wrong(); }

  function next() {
    if (S.party) return passOn();

      store.set('fx-bests', bests);

      let list = null;

  /* ---------- Bonus questions ---------- */
  const capOK = c => !NO_CAP_Q.has(c.a2) && !plain(c.cap).includes(plain(c.name)) && !plain(c.name).includes(plain(c.cap));
  const BONUS_MAKERS = {
    capital(c) {
      const wrong = [...(BIG[c.a2] || [])];
      const add = a => { const o = C[a]; if (a !== c.a2 && capOK(o) && o.cap !== c.cap && !wrong.includes(o.cap)) wrong.push(o.cap); };
      shuffle(c.borders).forEach(add);

    continent(c) {

    },
    neighbour(c) {

      const second = []; c.borders.forEach(b => C[b].borders.forEach(x => { if (ok(x) && !second.includes(x)) second.push(x); }));

  // A finished day for the family group chat: the winner, everyone's score that day, and the month's points table.

  function featsOn(date) {

  const featLine = x => x.key === 'world' ? `🌍 ${x.name} stamped every country in the passport!` : x.key === 'expert' ? `⭐ ${x.name} completed the Expert passport!` : `🗺️ ${x.name} completed ${CONTS[+x.key.slice(1)]}!`;

    const names = won.map(r => r.name), month = date.slice(0, 7), monthName = MONTH_NAMES[+month.slice(5) - 1];

  // The daily wins: who has won Today's challenge most often, this month and since the start

    return `<div class="pp-page">
      <div class="pp-top"><span>${pg.name}${pg.parts > 1 ? ` · ${pg.part} of ${pg.parts}` : ''}</span><span>${right}</span></div>
      ${pg.codes.length ? `<div class="pp-grid">${pg.codes.map(stamp).join('')}</div>` : `<div class="pp-none">No stamps from ${pg.name} yet. Name one of its ${pg.total} flags to earn the first.</div>`}
      <div class="pp-foot"><span>Visas</span><span>${n - 1}</span></div>
    </div>`;
  }
  const ppNav = (n, len) => n === 0 ? `<span class="fx-label mx-auto py-2">Tap the passport to open it</span>`
    : `<button class="fx-quiet whitespace-nowrap" data-act="pp-prev">${n === 1 ? 'Close' : 'Previous'}</button>
      <span class="fx-label whitespace-nowrap">Page ${n} of ${len - 1}</span>
      <button class="fx-quiet whitespace-nowrap" data-act="pp-next" ${n >= len - 1 ? 'disabled style="visibility:hidden"' : ''}>Next</button>`;
  function viewPassport() {
    const pages = ppPages(), done = passportDone(P.name), total = done ? experts(P.name).length : pages[1].total;
    S.pp = Math.min(S.pp || 0, pages.length - 1);
    return `<main class="fx-sheet mx-auto max-w-xl">
      <div class="fx-band flex items-end justify-between gap-3">
        <div class="min-w-0"><p class="fx-label">Passport of</p><h1 class="fx-h text-3xl fx-clip whitespace-nowrap">${esc(P.name)}</h1></div>
        <p class="fx-label flex-none text-right"><span class="fx-num">${total}</span><br>of ${POOL.length} ${done ? 'expert stars' : 'stamped'}</p>
      </div>
      <div class="fx-meter" role="img" aria-label="${total} of ${POOL.length} ${done ? 'expert stars' : 'flags stamped'}"><i style="width:${(100 * total / POOL.length).toFixed(1)}%${done ? ';background:var(--gold)' : ''}"></i></div>
      <div class="pp-stage mt-2"><div class="pp-book" id="pp-book" role="button" tabindex="0" data-act="pp-flip" aria-label="Passport. Tap the right side to turn the page, the left side to go back."><div class="pp-leaf">${ppPage(S.pp)}</div></div></div>
      <div class="flex items-center justify-between gap-3" id="pp-nav">${ppNav(S.pp, pages.length)}</div>
      <p class="text-ink-soft text-sm text-center mt-2" id="pp-rule">${done ? `Passport complete. A gold star goes on a stamp the first time you name that flag with no hints. Star all ${POOL.length} for the Expert passport.`
        : `A flag is stamped the first time you name it correctly, in any recorded game. Complete a continent, then the whole world.`}</p>
      <button class="fx-go mt-5" data-act="back">Back</button>
    </main>`;
  }
  // Turn to page n: the page being left swings away on its spine, or the earlier page swings back over.
  let turning = false;
  function turnTo(n) {
    const book = app.querySelector('#pp-book'), len = ppPages().length, from = S.pp;
    if (!book || turning || n === from || n < 0 || n >= len) return;
    const cur = book.querySelector('.pp-leaf'), next = document.createElement('div');
    next.className = 'pp-leaf'; next.innerHTML = ppPage(n);
    S.pp = n; SFX.page();
    app.querySelector('#pp-nav').innerHTML = ppNav(n, len);
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { cur.replaceWith(next); return hydrate(book); }
    turning = true;
    let finished = false;      // each turn tidies up exactly once, whichever signal arrives first
    const done = () => { if (finished) return; finished = true; turning = false; cur.remove(); next.classList.remove('in'); };
    if (n > from) { book.insertBefore(next, cur); cur.classList.add('out'); cur.addEventListener('animationend', done, { once: true }); }
    else { next.classList.add('in'); book.appendChild(next); next.addEventListener('animationend', done, { once: true }); }
    setTimeout(done, 1000);   // in case the animation never reports back
    hydrate(book);
  }

  function viewHead() {
    const segs = S.round.map((_, i) => {
      const e = S.log[i];
      return `<i class="fx-seg ${e ? (e.ok ? 'ok' : 'miss') : i === S.i && S.screen === 'play' ? 'now' : ''}"></i>`;
    }).join('');
    const n = S.round.length, done = S.screen === 'end' ? n : S.i + 1;
    return `<div class="fx-band">
        <div class="flex items-baseline justify-between gap-3"><p class="fx-label fx-clip whitespace-nowrap min-w-0">${modeLabel()}${S.practice ? ' · practice' : ''}</p>${muteBtn()}</div>
        <div class="flex items-center justify-between gap-3 mt-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="fx-ava" style="--s:2.75rem" aria-hidden="true">${esc(P.avatar)}</span>
            <p class="fx-word fx-clip min-w-0">${esc(P.name)}</p>
          </div>
          <dl class="flex gap-5 text-right">
            <div><dt class="fx-label">Score</dt><dd class="fx-num mt-0.5">${fmt(S.score)}</dd></div>
            <div><dt class="fx-label">Streak</dt><dd class="fx-num mt-0.5">${S.streak}</dd></div>
          </dl>
        </div>
      </div>
      <div class="fx-progress" role="img" aria-label="Flag ${done} of ${n}">
        <span class="fx-label flex-none" style="font-weight:600">${S.screen === 'end' ? 'Round complete' : `Flag ${done} of ${n}`}</span>
        <div class="fx-scale-bar" style="grid-template-columns:repeat(${n}, minmax(0, 1fr))">${segs}</div>
      </div>`;
  }

  function viewPlate() {
    const q = S.q, c = C[q.a2];
    return `<figure class="fx-plate">
      <div class="flex justify-between gap-3 fx-label"><span>Flag ${String(S.i + 1).padStart(2, '0')}</span><span id="fx-pos"></span></div>
      ${S.limit ? `<div class="fx-clock" aria-hidden="true"><i id="fx-clock-bar"></i></div>` : ''}
      <div class="fx-flagbox">
        <img class="fx-flag" style="--ar:${c.ar}" data-flag="${q.a2}" alt="The flag to identify">
        <div class="fx-seal">${COMPASS(56)}<span class="fx-label">Sealed until you decide</span></div>
      </div>
      <figcaption class="fx-caption" id="fx-cap"></figcaption>
    </figure>
    <div class="fx-perf" aria-hidden="true"></div>`;
  }

  function hintBtn(h) {
    const q = S.q, c = C[q.a2], used = q.hints.includes(h.id), barred = !!q.wager;
    const reveal = h.id === 'continent' ? contName(c) : h.id === 'capital' ? c.cap : 'Two struck out';
    return `<button class="fx-hint ${used ? 'used' : ''}" data-act="hint" data-id="${h.id}" ${used || barred ? 'disabled' : ''} ${barred ? 'style="opacity:.45"' : ''}
        aria-label="${used ? `${h.label} hint used: ${esc(reveal)}` : barred ? `${h.label} hint, not allowed on a wagered flag` : `${h.label} hint, costs ${h.cost} points`}">
      <span class="fx-label">${h.label}</span>
      ${used ? `<span class="fx-reveal">${esc(reveal)}</span>` : `<span class="fx-cost">−${h.cost} pts</span>`}
    </button>`;
  }

  function optBtn(text, i, state, act) {
    const mark = state === 'right' ? '✓' : state === 'wrong' ? '✕' : '';
    return `<button class="fx-opt ${state}" data-act="${act}" data-i="${i}" ${state ? 'disabled' : ''}>
      <span class="fx-key">${'ABCD'[i]}</span><span>${esc(text)}</span><span class="fx-mark" aria-hidden="true">${mark}</span>
    </button>`;
  }

  const facts = c => `<p class="text-sm text-ink-soft mt-3 text-center">Capital <b class="text-ink font-semibold">${esc(c.cap)}</b> · ${esc(contName(c))} · about ${fmtPop(c.pop)} people</p>`;
  function nextBtn() {
    const last = S.i >= S.round.length - 1;
    const label = !S.party ? (last ? 'See round results' : 'Next flag')
      : last && M.seats.every(seat => seat.S === S || seat.S.done) ? 'See who won'
      : `Pass to ${esc(M.seats[(M.turn + 1) % M.seats.length].P.name)}`;
    return `<button class="fx-go mt-4" data-act="next" data-primary>${label}</button>`;
  }

  function viewPanel() {
    const q = S.q, c = C[q.a2], e = S.log[S.log.length - 1];

    if (q.phase === 'wager') {
      const stake = (v, i) => {
        const can = v <= S.score;
        return `<button class="fx-opt ${can ? '' : 'out'}" style="${can ? '' : 'text-decoration:none;'}${v ? '' : 'grid-column:1 / -1'}" data-act="wager" data-v="${v}" ${can ? '' : 'disabled'}>
          <span class="fx-key">${'ABCD'[i]}</span><span>${v ? `Risk ${v}` : 'No wager'}</span><span class="fx-mark" aria-hidden="true"></span></button>`;
      };
      return `<div class="mt-3 min-h-[5.6rem]">
          <p class="fx-label text-ochre">Final flag wager</p>
          <p class="font-script text-xl leading-tight mt-1">Risk some of your ${fmt(S.score)} points on the last flag?</p>
          <p class="text-sm text-ink-soft mt-1.5">Name it and win the same amount on top. Miss and lose it. A wagered flag allows no hints.</p>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-3">${[0, ...WAGERS].map(stake).join('')}</div>`;
    }

    if (q.phase === 'guess') {
      const locked = q.hints.length > 0, ahead = locked ? 0 : streakBonus(S.streak + 1), tipOn = S.tip && S.i === 0 && !q.wager && !locked;
      const status = q.wager ? `<p class="fx-pill gold">Risking ${q.wager} · no hints</p>`
        : `<p class="fx-pill ${locked ? 'no' : 'ok'}">${locked ? 'Bonus locked' : 'Bonus in play'}</p>`;
      return `<div class="flex items-center justify-between gap-3 mt-3">
          <p class="fx-label flex items-baseline gap-2">Worth <span class="fx-num text-2xl leading-none">${flagWorth(q.hints)}</span>${ahead ? `<span class="text-verdigris" style="font-weight:600">+${ahead} streak</span>` : ''}</p>
          ${status}
        </div>
        ${tipOn ? `<p class="fx-tip" id="fx-tip"><b>Tip:</b> stuck? A hint costs a few points and the bonus question, but beats a miss.</p>` : ''}
        ${tipOn ? '' : `<p class="fx-label fx-hint-l"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.6 11.2C4.2 10.3 3.3 8.8 3.3 7.1a4.7 4.7 0 0 1 9.4 0c0 1.7-.9 3.2-2.3 4.1v1.1H5.6z"/><path d="M6.3 14.3h3.4"/></svg>${q.wager ? 'No hints on a wagered flag' : q.hints.length ? 'Hints used on this flag' : 'Need a hint? Tap one'}</p>`}
        <div class="grid grid-cols-3 gap-2 mt-1.5" role="group" aria-label="Hints">${HINTS.map(hintBtn).join('')}</div>
        <div class="grid grid-cols-2 gap-2 mt-3">${q.options.map((a, i) => optBtn(C[a].name, i, q.out.includes(a) ? 'out' : '', 'answer')).join('')}</div>`;
    }

    if (q.phase === 'result') {
      const flagOpts = `<div class="grid grid-cols-2 gap-2 mt-3">${q.options.map((a, i) =>
        optBtn(C[a].name, i, a === q.a2 ? 'right' : a === q.pick ? 'wrong' : q.out.includes(a) ? 'out' : 'dim', 'answer')).join('')}</div>`;
      const gain = e.pts + e.streakPts + e.speedPts + e.wagerPts, bits = [];
      let stamp, tail;
      if (!e.ok) {
        stamp = `<span class="fx-stamp no">${e.timedOut ? 'Time up' : 'Missed'}<br>${signed(gain)}</span>`;
        bits.push(`This is the flag of <b>${esc(the(c))}</b>.`);
        bits.push(e.wagerPts ? `The wager costs you ${fmt(-e.wagerPts)}, and the streak goes back to zero.` : 'No points, and the streak goes back to zero.');
        tail = facts(c) + nextBtn();
      } else {
        stamp = `<span class="fx-stamp ok">Correct<br>${signed(gain)}</span>`;
        if (e.cost) bits.push(`${BASE} less ${e.cost} for ${e.hints.length === 1 ? 'the hint' : e.hints.length + ' hints'}.`);
        if (e.streakPts) bits.push(`${e.streak} in a row: +${e.streakPts}.`);
        else if (e.runLost) bits.push(`The hint ends your streak of ${e.runLost}.`);
        if (e.speedPts) bits.push(`Quick answer: +${e.speedPts}.`);
        if (e.wagerPts) bits.push(`Wager won: +${e.wagerPts}.`);
        if (e.bonus === 'locked') { bits.push('The bonus question is locked for this flag because a hint was used.'); tail = facts(c) + nextBtn(); }
        else { bits.push('No hints, so the bonus question is unlocked.'); tail = `<button class="fx-go mt-4" data-act="bonus" data-primary>Bonus question · +${BONUS}</button>`; }
      }
      return `<div class="flex items-center gap-4 mt-3 min-h-[5.6rem]" role="status">${stamp}<p class="text-[.97rem] leading-snug min-w-0">${bits.join(' ')}</p></div>${flagOpts}${tail}`;

          <p class="fx-label text-ochre">Bonus question · ${b.label} · worth <span class="fx-num" style="color:inherit">${BONUS}</span></p>

        <p class="text-[.97rem] leading-snug min-w-0">${won ? `Right. That makes <b>${fmt(entryTotal(e))}</b> for this flag.` : `${b.pick === null ? 'Out of time. ' : ''}The answer was <b>${esc(b.options[b.answer])}</b>. You keep the ${fmt(entryTotal(e))} for the flag.`}</p>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">${b.options.map((t, i) => optBtn(t, i, i === b.answer ? 'right' : i === b.pick ? 'wrong' : 'dim', 'bonus-answer')).join('')}</div>
      ${facts(c)}${nextBtn()}`;
  }

  function entryNote(e) {

  }

  const logRows = log => log.map((e, i) => `<li class="flex items-center gap-3 py-1.5 ${i ? 'border-t border-dotted border-rule' : ''}">
        <span class="fx-label w-6 flex-none">${String(i + 1).padStart(2, '0')}</span>

        <span class="min-w-0 flex-1 leading-tight"><span class="block font-medium ${e.ok ? '' : 'text-madder'}">${esc(C[e.a2].name)}</span><span class="block text-xs text-ink-soft">${entryNote(e)}</span></span>
        <span class="fx-num ${entryTotal(e) < 0 ? 'text-madder' : ''}" ${entryTotal(e) < 0 ? 'style="color:var(--madder)"' : ''}>${entryTotal(e) < 0 ? signed(entryTotal(e)) : fmt(entryTotal(e))}</span>

  // Everyone in a pass-and-play game, leader first. `mark` is the seat to pick out: whoever is playing, or about to.
  const unplayed = () => M.seats.every(seat => !seat.S.log.length);
  const standingRows = mark => (unplayed() ? M.seats.map((seat, k) => ({ k, P: seat.P, S: seat.S, place: (k - M.first + M.seats.length) % M.seats.length + 1 })).sort((a, b) => a.place - b.place) : standings())
    .map(r => `<li class="fx-hrow ${r.k === mark ? 'hot' : ''} ${r.place === 1 && r.S.score > 0 ? 'top' : ''}">

  const endEarlyBtn = () => `<button class="fx-quiet" data-act="end-early">${S.confirmEnd ? `Tap again to end this ${S.party ? 'game' : 'round'} now` : `End ${S.party ? 'game' : 'round'} early`}</button>`;

  function viewLog() {

        <div class="fx-tile"><dt class="fx-label">Score</dt><dd class="fx-num text-2xl leading-tight">${fmt(S.score)}</dd></div>
        <div class="fx-tile"><dt class="fx-label">Streak</dt><dd class="fx-num text-2xl leading-tight">${S.streak}</dd></div>

      ${table}

        ${line('Streak bonus', t.streak, 'text-verdigris')}
        ${S.clock ? line('Speed bonus', t.speed, 'text-verdigris') : ''}
        ${t.wager ? line('Final flag wager', t.wager, t.wager > 0 ? 'text-verdigris' : 'text-madder') : ''}
        <tr class="total"><th scope="row">Total</th><td>${fmt(S.score)}</td></tr>

      ${best.score ? `<p class="fx-label mt-4">Your best here <span class="fx-num">${fmt(best.score)}</span> · Longest streak <span class="fx-num">${best.streak}</span></p>` : ''}

  }

  // What a player pastes into the family chat after today's challenge.
  function shareText() {
    const t = totals(S.log);
    const grid = S.round.map((_, i) => { const e = S.log[i]; return !e ? '⬜' : !e.ok ? '🟥' : e.hints.length ? '🟨' : '🟩'; }).join('');

  }

  // What a round added to the passport, and how close the next finish line is
  function stampNote(s, name) {
    const parts = [], left = stillMissing(name).length, done = passportDone(name);
    if (s.newStamps) parts.push(`<b class="font-semibold">${plural(s.newStamps, 'new passport stamp')}.</b> <span class="text-ink-soft">${stamps(name).filter(a => C[a]).length} of ${POOL.length} collected.</span>`);
    if (s.newExpert) parts.push(`<b class="font-semibold">${plural(s.newExpert, 'new expert star')}.</b> <span class="text-ink-soft">${experts(name).length} of ${POOL.length} for the Expert passport.</span>`);
    if (left && left <= LAST_STRETCH) parts.push(`<span class="text-ink-soft">Only ${left} to go${done ? ' for the Expert passport' : ' for a full passport'}. Free play now deals ${left === 1 ? 'it' : 'them'} more often.</span>`);
    return parts.length ? `<p class="text-sm mt-2" id="fx-stamp-note">${parts.join(' ')}</p>` : '';
  }
  function featBlock(key) {
    if (key === 'world') return `<div class="fx-feat big" id="fx-feat-world"><p class="fx-label">Every country in the world</p><h2>🌍 Passport complete</h2>
      <p>All ${POOL.length} flags are stamped. Your passport cover is now gold.</p>
      <p><b class="font-semibold">Next, the Expert passport:</b> every flag you name with no hints now earns a gold star on its stamp. Star all ${POOL.length} to finish it.</p></div>`;
    if (key === 'expert') return `<div class="fx-feat big" id="fx-feat-expert"><p class="fx-label">Every flag, not one hint</p><h2>★ Expert passport complete</h2>
      <p>You have named all ${POOL.length} flags without a single hint. The whole world, mastered.</p></div>`;
    const ci = +key.slice(1);
    return `<div class="fx-feat" data-feat="${key}"><h2>🗺️ ${CONTS[ci]} complete</h2><p>All ${CONT_CODES[ci].length} of its flags are stamped in your passport.</p></div>`;
  }

  function viewEnd() {
    const t = totals(S.log), lockedN = S.log.filter(e => e.bonus === 'locked').length, daily = S.mode === 'daily', have = stamps(P.name).length;
    const summary = S.perfect ? 'Every flag and every bonus question right. A gold stamp is in your passport, and a gold star marks this score.'
      : t.named === S.round.length && !t.cost ? 'Every flag named without a single hint.'
      : t.cost ? `Hints cost you ${fmt(t.cost)} points and locked ${plural(lockedN, 'bonus question')}.` : 'Not one hint used all round.';
    return `<div class="lg:grid lg:grid-cols-[minmax(0,1fr)_22rem] lg:gap-7 lg:items-start">
      <main class="fx-sheet">
        <div id="fx-head">${viewHead()}</div>
        <hr class="fx-rule my-5">

  function viewMatch() {

        ${placed.length ? `<p class="text-sm ${flawless.length ? 'mt-2' : 'mt-4'}"><b class="font-semibold">High scores:</b> ${placed.map(r => `${esc(r.P.name)} ${ORD[r.S.place - 1]}`).join(', ')}.</p>` : ''}

  }

  /* ---------- Rendering ---------- */
  const app = document.getElementById('app');
  const hydrate = root => root.querySelectorAll('img[data-flag]').forEach(img => { if (!img.src) img.src = flagURL(img.dataset.flag); });

  // The clock for timed rounds. It reads the real time on every tick, so a sleeping tab cannot stretch it.
  let clockId = null, lastSecs = -1;
  function clockStop() { if (clockId) { clearInterval(clockId); clockId = null; } }
  function clockTick() {
    const q = S.q;
    if (S.screen !== 'play' || !q || !clockPhase()) return clockStop();
    const left = S.limit - (Date.now() - q.t0) / 1000, secs = Math.max(0, Math.ceil(left));
    const bar = app.querySelector('#fx-clock-bar'), pos = app.querySelector('#fx-pos');
    if (bar) { bar.style.transform = `scaleX(${Math.max(0, left / S.limit)})`; bar.parentNode.classList.toggle('low', left <= 5); }
    if (pos) pos.textContent = secs + ' s';
    if (secs !== lastSecs) { lastSecs = secs; if (secs <= 5 && secs > 0) SFX.tick(); }

  }
  // Whether the clock is running: on every flag of a timed round, and on Today's challenge's bonus questions too.
  const clockPhase = () => !!(S.limit && S.q && (S.q.phase === 'guess' || (S.q.phase === 'bonus' && bonusTimed())));

  // A long word in an answer steps down a size until it fits on its line, so no name is ever split mid-word.
  function fitOpts() {
    for (const lab of app.querySelectorAll('.fx-opt > span:nth-child(2)')) {
      lab.style.fontSize = ''; lab.style.overflowWrap = 'normal';
      for (const size of ['.94rem', '.88rem', '.82rem', '.76rem']) {
        if (lab.scrollWidth <= lab.clientWidth) break;
        lab.style.fontSize = size;
      }
      lab.style.overflowWrap = '';
    }
  }
  addEventListener('resize', fitOpts);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitOpts);

  function render(focus) {
    if (S.screen !== 'play') {
      clockStop();
      app.innerHTML = ({ start: viewStart, rules: viewRules, board: viewBoard, passport: viewPassport, end: viewEnd, pass: viewPass, match: viewMatch, family: viewFamily })[S.screen]();
    } else {
      if (!app.querySelector('#fx-panel')) {
        app.innerHTML = `<div class="lg:grid lg:grid-cols-[minmax(0,1fr)_22rem] lg:gap-7 lg:items-start">
          <main class="fx-sheet"><div id="fx-head"></div><div id="fx-plate"></div><div id="fx-panel"></div></main>
          <aside class="fx-sheet mt-5 lg:mt-0" id="fx-log"></aside>
        </div>`;
      }
      const q = S.q, c = C[q.a2], plate = app.querySelector('#fx-plate');
      app.querySelector('#fx-head').innerHTML = viewHead();
      // The plate is only rebuilt when the flag changes, so the image never flickers mid-question.
      if (plate.dataset.key !== S.i + q.a2) { plate.innerHTML = viewPlate(); plate.dataset.key = S.i + q.a2; }
      const sealed = q.phase === 'wager', revealed = !sealed && q.phase !== 'guess', cap = app.querySelector('#fx-cap');
      plate.firstElementChild.classList.toggle('sealed', sealed);
      cap.textContent = sealed ? 'The final flag' : revealed ? c.name : 'Which country flies this flag?';
      cap.classList.toggle('named', revealed);
      app.querySelector('#fx-pos').textContent = revealed ? coords(c) : sealed ? 'Final flag' : 'Destination unknown';

    }
  }
  const go = () => { render(false); window.scrollTo(0, 0); };

  // Start screen: these update in place so the name box keeps its text and focus.
  function setAvatar(e) {
    S.avatar = e;
    app.querySelector('#fx-me').textContent = e;
    app.querySelectorAll('#fx-hand .fx-ava').forEach(b => b.setAttribute('aria-pressed', b.dataset.e === e));
  }
  app.addEventListener('input', ev => {
    if (ev.target.classList.contains('fx-guest')) {      // pass-and-play names update in place, so the box keeps its focus

    }
    if (ev.target.id === 'fx-code') { S.code = ev.target.value; app.querySelector('#fx-code-err').textContent = ''; return; }
    if (ev.target.id !== 'fx-name') return;
    if (S.claim) { S.claim = null; S.name = ev.target.value; render(false); const box = app.querySelector('#fx-name'); box.focus(); box.setSelectionRange(box.value.length, box.value.length); return; }
    S.name = ev.target.value;

  app.addEventListener('submit', async ev => {
    ev.preventDefault();
    if (ev.target.id === 'fx-join') return joinFamily();
    if (ev.target.id !== 'fx-setup') return;
    const name = cleanName(S.name);
    if (!name) {
      app.querySelector('#fx-name-err').textContent = 'Enter a player name to start.';
      app.querySelector('#fx-name').focus();
      return;
    }

  });
  async function joinFamily() {
    const input = app.querySelector('#fx-code'), err = app.querySelector('#fx-code-err'), btn = app.querySelector('#fx-join-btn'), code = cleanCode(input.value);

  function copyText(btn, text, box) {

  app.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const act = el.dataset.act;
    if (act === 'avatar') return setAvatar(el.dataset.e);

    if (act === 'copy') return copyResult(el);

    if (act === 'text') { bigText = !bigText; store.set('fx-text', bigText); applyText(); SFX.tap(); return render(false); }
    if (act === 'mute') { muted = !muted; store.set('fx-mute', muted); if (muted) hush(); else { wake(); SFX.right(); } return render(false); }
    if (act === 'opt') {
      const k = el.dataset.k, v = el.dataset.v;
      O[k] = k === 'clock' ? v === 'true' : k === 'each' ? +v : v;
      if (O.mode === 'party' && !O.guests.length) O.guests.push({ name: '', avatar: spareAvatar() });

    }

    if (act === 'guest-del') { O.guests.splice(+el.dataset.i, 1); tidyParty(); return render(false); }
    if (act === 'guest-ava') { O.guests[+el.dataset.i].avatar = spareAvatar(); SFX.tap(); return render(false); }
    if (act === 'tab') { S.tab = el.dataset.v; S.confirmWipe = false; if (S.tab === 'wins') { S.rank = S.rank || store.get('fx-rank', 'wins'); cloudSoon(); } return render(false); }
    if (act === 'span') { S.span = el.dataset.v; return render(false); }
    if (act === 'rank') { S.rank = el.dataset.v; store.set('fx-rank', S.rank); return render(false); }
    if (act === 'wipe') {
      if (!S.confirmWipe) { S.confirmWipe = true; return render(false); }
      wipeRecords(); S.confirmWipe = false; SFX.tap();
      return render(false);
    }
    if (act === 'family') { S.back = S.screen; S.screen = 'family'; S.confirmLeave = false; return go(); }
    if (act === 'family-sync') { cloudState.ok = null; cloudSync(); return render(false); }
    if (act === 'family-leave') {
      if (!S.confirmLeave) { S.confirmLeave = true; return render(false); }

      return render(false);
    }
    if (act === 'claim-no') { S.claim = null; S.name = ''; render(false); app.querySelector('#fx-name').focus(); return; }
    if (act === 'rules-back') { S.screen = 'start'; return go(); }
    if (act === 'choose') { const party = !!M; openRules(); if (party) O.mode = 'party'; return go(); }
    if (act === 'board') { S.back = S.screen; S.screen = 'board'; S.confirmWipe = false; S.tab = S.back === 'end' || S.back === 'match' ? S.table : S.tab || O.pool; cloudSoon(); return go(); }
    if (act === 'passport') { S.back = S.screen; S.screen = 'passport'; S.pp = 0; turning = false; return go(); }
    if (act === 'pp-next') return turnTo(S.pp + 1);
    if (act === 'pp-prev') return turnTo(S.pp - 1);
    if (act === 'pp-flip') { const r = el.getBoundingClientRect(); return turnTo(S.pp + (S.pp > 0 && ev.clientX - r.left < r.width * .3 ? -1 : 1)); }
    if (act === 'back') { S.screen = S.back || 'start'; return go(); }
    if (act === 'change-player') { startScreen(true); go(); app.querySelector('#fx-name').focus(); return; }
    let focus = true, top = false;
    if (act !== 'end-early') S.confirmEnd = false;
    if (act === 'play' && O.mode === 'party') {

  // Keyboard: A-D or 1-4 answer the question on screen.

    if (i < 0) return;
